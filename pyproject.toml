[project]
name = "ensemble-distillation"
version = "0.1.0"
description = "Distilling tuned tree ensembles into small students"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "lightgbm",
  "torch",
  "matplotlib",
  "joblib",
  "pyyaml",
  "psutil",
  "threadpoolctl",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
